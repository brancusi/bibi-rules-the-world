---
# Change this before publishing your configuration repository.
bibi_config_repo_url: "https://github.com/brancusi/bibi-rules-the-world.git"
bibi_config_repo_ref: "main"

bibi_admin_user: "bibi-admin"
bibi_agent_user: "bibi"
bibi_agent_home: "/home/bibi"

# FirstMate is pinned so a rebuild does not silently change its operating rules.
# Review upstream changes before replacing this commit.
firstmate_repo_url: "https://github.com/kunchenguid/firstmate.git"
firstmate_ref: "673b6ad39d01183a19c5bd8a52675a2ee8ea06e6"

node_major: 24
nodesource_key_sha256: "b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d"

# Exact npm pins observed on 2026-07-22. Deliberately update these in a PR.
pi_version: "0.81.1"
firecrawl_cli_package: "firecrawl-cli@1.19.27"
axi_packages:
  - "gh-axi@0.1.27"
  - "chrome-devtools-axi@0.1.27"
  - "lavish-axi@0.1.43"
  - "tasks-axi@0.2.3"
  - "quota-axi@0.1.11"

# Official immutable release artifacts reviewed on 2026-08-01. The private
# DigitalOcean Pi package requires doctl >=1.165.0 within the 1.x series.
doctl_version: "1.166.0"
doctl_release_base_url: "https://github.com/digitalocean/doctl/releases/download"
doctl_cache_dir: "/var/cache/bibi/doctl"
doctl_install_path: "/usr/local/bin/doctl"
doctl_install_owner: "root"
doctl_install_group: "root"
doctl_install_mode: "0555"
doctl_archives:
  x86_64:
    arch: "amd64"
    sha256: "1596424b64091a7939bde561daf2402ca8a141966429928e688d20d17091ec89"
  aarch64:
    arch: "arm64"
    sha256: "a9857d2ef4498f6affb9baae2b37b890ccc4ddda9ec01e58b63a2e99e47eb363"

# This private collection is intentionally not fetched by cloud-init/Ansible.
# After `gh auth login`, the daily user runs bibi-pi-extensions-update. The
# merged collection at this commit requires Node.js 22+, Pi 0.81.1-compatible,
# official doctl 1.165.0+ (1.x), and the pi-ai, coding-agent, pi-tui, and
# typebox core peers supplied by Pi.
pi_extensions_repo_url: "https://github.com/brancusi/pi-extensions.git"
pi_extensions_ref: "bdacbf815b64183855f174865a3f54272c9d0501"
pi_extensions_package_version: "1.1.0"

no_mistakes_version: "1.40.0"
