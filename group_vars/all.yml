---
# Change this before publishing your configuration repository.
bibi_config_repo_url: "https://github.com/brancusi/bibi-rules-the-world.git"
bibi_config_repo_ref: "main"

bibi_admin_user: "bibi-admin"
bibi_agent_user: "bibi"
bibi_agent_home: "/home/bibi"

# FirstMate is pinned so a rebuild does not silently change its operating rules.
# Review upstream changes before replacing this commit.
firstmate_repo_url: "https://github.com/kunchenguid/firstmate.git"
firstmate_ref: "673b6ad39d01183a19c5bd8a52675a2ee8ea06e6"

node_major: 24
nodesource_key_sha256: "b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d"

# Official immutable releases reviewed on 2026-08-26. Java and Clojure live
# under a shared root so no project checkout supplies either toolchain.
shared_toolchain_root: "/opt/bibi/toolchains"
shared_toolchain_cache_dir: "/var/cache/bibi/toolchains"
shared_toolchain_bin_dir: "/usr/local/bin"
shared_toolchain_profile_path: "/etc/profile.d/60-bibi-clojure-toolchain.sh"
shared_toolchain_owner: "root"
shared_toolchain_group: "root"
jdk_version: "21.0.12+8"
jdk_runtime_version: "21.0.12+8-LTS"
jdk_archive_version: "21.0.12_8"
jdk_release_base_url: "https://github.com/adoptium/temurin21-binaries/releases/download"
jdk_archives:
  x86_64:
    arch: "x64"
    sha256: "e4446ff06a276155697597cc0f1b15da004ff083f4964a35271ecee567177370"
  aarch64:
    arch: "aarch64"
    sha256: "eba38e871b02d407897bfe017ea35352dfc1420ef6d2112425b0c67325ca509d"
clojure_cli_version: "1.12.4.1618"
clojure_cli_release_base_url: "https://download.clojure.org/install"
clojure_cli_sha256: "13769da6d63a98deb2024378ae1a64e4ee211ac1035340dfca7a6944c41cde21"

# Exact npm pins observed and source-reviewed on 2026-08-24. Deliberately
# update these in a PR; moving npm tags are not provisioning inputs.
# chrome-devtools-axi moved to the Captain-approved 0.1.31 on 2026-08-28,
# verified through the same trusted registry path the installer uses
# (`npm view chrome-devtools-axi@0.1.31 name version dist.integrity`).
pi_version: "0.83.0"
wrangler_package: "wrangler@4.125.0"
firecrawl_cli_package: "firecrawl-cli@1.19.27"
axi_packages:
  - "gh-axi@0.1.30"
  - "chrome-devtools-axi@0.1.31"
  - "lavish-axi@0.1.50"
  - "tasks-axi@0.2.5"
  - "quota-axi@0.1.29"

# Public Pi packages are reconciled through Pi's official package installer as
# the daily user. Exact npm versions are retained in Pi settings.
pi_public_packages:
  - "npm:@tmustier/pi-files-widget@0.2.0"
  - "npm:pi-web-access@0.24.0"

# Official Cloudflare agent skills reviewed at this verified upstream commit.
# Only these two skills are linked into Pi; the source checkout remains pinned.
cloudflare_skills_repo_url: "https://github.com/cloudflare/skills.git"
cloudflare_skills_ref: "f96bff754e428838818017f75817f0f9428acd48"
cloudflare_skills_checkout: "{{ bibi_agent_home }}/.local/share/bibi/cloudflare-skills"
cloudflare_skill_link_dir: "{{ bibi_agent_home }}/.pi/agent/skills"
cloudflare_skill_names:
  - "cloudflare"
  - "wrangler"

# Official immutable release artifacts reviewed on 2026-08-01. The private
# DigitalOcean Pi package requires doctl >=1.165.0 within the 1.x series.
doctl_version: "1.166.0"
doctl_release_base_url: "https://github.com/digitalocean/doctl/releases/download"
doctl_cache_dir: "/var/cache/bibi/doctl"
doctl_install_path: "/usr/local/bin/doctl"
doctl_install_owner: "root"
doctl_install_group: "root"
doctl_install_mode: "0555"
doctl_archives:
  x86_64:
    arch: "amd64"
    sha256: "1596424b64091a7939bde561daf2402ca8a141966429928e688d20d17091ec89"
  aarch64:
    arch: "arm64"
    sha256: "a9857d2ef4498f6affb9baae2b37b890ccc4ddda9ec01e58b63a2e99e47eb363"

# This private collection is intentionally not fetched by cloud-init/Ansible.
# After `gh auth login`, the daily user runs bibi-pi-extensions-update. The
# merged collection at this commit requires Node.js 22+, Pi 0.83.0-compatible,
# official doctl 1.165.0+ (1.x), and the pi-ai, coding-agent, pi-tui, and
# typebox core peers supplied by Pi.
pi_extensions_repo_url: "https://github.com/brancusi/pi-extensions.git"
pi_extensions_ref: "c66061fd372ad36e4ffbf61c41fb92dd1d2d9152"
pi_extensions_package_version: "1.5.0"

no_mistakes_version: "1.40.0"
no_mistakes_archives:
  x86_64:
    arch: "amd64"
    sha256: "2445b65179d0e8e9bbf408322f57190f344f9946cfed3971c84fa16ce4122e91"
  aarch64:
    arch: "arm64"
    sha256: "e679370ccfe20e3028c59ed984510e7077996a0d17b8dc196e5b199218f1db9d"

# Memory safety net, reviewed 2026-08-28 after repeated browser QA left
# reparented chrome-devtools-axi bridges, chrome-devtools-mcp processes, their
# watchdogs, and headless Chromium trees resident on this 8 GiB swapless host.
# README.md documents the policy, the protected cases, and the rollback path.
memory_guard_version_pin: "1.0.0"
memory_guard_enabled: true
memory_guard_manage_system: true
memory_guard_source: "scripts/bibi_memory_guard.py"
memory_guard_config_template: "templates/bibi-memory-guard.conf.j2"
memory_guard_service_template: "templates/bibi-memory-guard.service.j2"
memory_guard_timer_template: "templates/bibi-memory-guard.timer.j2"
memory_guard_owner: "root"
memory_guard_group: "root"
memory_guard_install_path: "/usr/local/sbin/bibi-memory-guard"
memory_guard_config_path: "/etc/bibi-memory-guard.conf"
memory_guard_service_path: "/etc/systemd/system/bibi-memory-guard.service"
memory_guard_timer_path: "/etc/systemd/system/bibi-memory-guard.timer"
memory_guard_state_dir: "/var/lib/bibi-memory-guard"
memory_guard_state_file: "/var/lib/bibi-memory-guard/status.json"
memory_guard_lock_file: "/run/bibi-memory-guard/run.lock"

# Ownership oracles. A leaked tree is only cleaned when these prove the owning
# worktree finished or disappeared; every name here is protective only.
memory_guard_axi_state_dir: "{{ bibi_agent_home }}/.chrome-devtools-axi"
memory_guard_firstmate_state_dir: "{{ bibi_agent_home }}/firstmate/state"
memory_guard_worktree_root: "{{ bibi_agent_home }}/.treehouse"
memory_guard_owner_commands:
  - "claude"
  - "pi"
  - "codex"
  - "opencode"
  - "cursor-agent"
  - "amp"
  - "goose"
  - "aider"

# Observation thresholds: these raise alerts and never authorise a kill.
memory_guard_mem_available_warn_percent: 20
memory_guard_mem_available_critical_percent: 10
memory_guard_swap_used_warn_percent: 25
memory_guard_swap_used_critical_percent: 60

# Destructive eligibility: independent of memory pressure by design.
memory_guard_leak_min_age_seconds: 3600
memory_guard_leak_min_member_age_seconds: 300
memory_guard_leak_min_tree_rss_kb: 262144
memory_guard_leak_max_tree_processes: 60
memory_guard_leak_max_trees_per_run: 2
memory_guard_owner_task_settled_seconds: 900
memory_guard_busy_state_fresh_seconds: 3600

# Termination behaviour, schedule, and bounded reporting.
memory_guard_term_grace_seconds: 10
memory_guard_term_poll_interval_seconds: 0.5
memory_guard_max_log_lines: 200
memory_guard_interval: "15min"
memory_guard_on_boot_sec: "10min"
memory_guard_randomized_delay: "2min"
memory_guard_timeout_seconds: 120
memory_guard_memory_max: "192M"

# A bounded 2 GiB swap file: 25% of RAM, deliberately far too small to absorb a
# repeat of the 5.1 GiB leak, so it stays a margin and never a substitute for
# cleanup. Swap usage is itself an alerting signal in the guard.
swap_manage_system: true
swap_sysctl_template: "templates/bibi-memory-sysctl.conf.j2"
swap_tool_path: "/usr/sbin:/sbin:/usr/bin:/bin"
swap_file_path: "/swapfile"
swap_file_owner: "root"
swap_file_group: "root"
swap_file_size_mb: 2048
swap_file_max_size_mb: 4096
swap_file_priority: 10
swap_sysctl_path: "/etc/sysctl.d/60-bibi-memory.conf"
swap_swappiness: 10
swap_vfs_cache_pressure: 50
swap_min_free_kbytes: 131072
