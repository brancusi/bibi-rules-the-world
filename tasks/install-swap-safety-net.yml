---
# A bounded swap file for an 8 GiB host that previously had none.
#
# Rationale (see README.md for the full comparison): the observed failure was
# leaked, idle browser trees holding resident anonymous pages on a host with no
# swap, so those pages could never be evicted and MemAvailable fell
# monotonically. Disk swap removes cold anonymous pages from RAM outright;
# zram only compresses them while still holding RAM, which buys far less on the
# idle-leak profile that actually caused the incident. The Droplet's root
# volume is local NVMe with ample free space, and the pages being written are
# cold by construction, so the latency cost is paid by memory nobody is using.
#
# The size is deliberately too small to absorb a repeat of the 5.1 GiB leak.
# Swap here is a margin that keeps the host responsive long enough for the
# memory guard to act and for an operator to read the alert; it is not a
# substitute for cleanup, and swap usage is itself an alerting signal.

- name: Refuse an unbounded swap file
  ansible.builtin.assert:
    that:
      - swap_file_size_mb | int > 0
      - swap_file_size_mb | int <= swap_file_max_size_mb | int
    fail_msg: >-
      swap_file_size_mb must be between 1 and {{ swap_file_max_size_mb }} MB so the
      safety net cannot grow into a substitute for cleaning leaks.

- name: Inspect any existing swap file
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
    follow: false
  register: swap_file_stat

- name: Refuse to manage a swap path that is not a regular file
  ansible.builtin.assert:
    that:
      - not swap_file_stat.stat.exists or (swap_file_stat.stat.isreg and not swap_file_stat.stat.islnk)
    fail_msg: "{{ swap_file_path }} exists but is not a regular file; refusing to replace it."

- name: Allocate the bounded swap file
  ansible.builtin.command:
    argv:
      - dd
      - "if=/dev/zero"
      - "of={{ swap_file_path }}"
      - "bs=1M"
      - "count={{ swap_file_size_mb }}"
    creates: "{{ swap_file_path }}"
  register: swap_file_created

- name: Restrict the swap file to its owning account
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: "{{ swap_file_owner }}"
    group: "{{ swap_file_group }}"
    mode: "0600"

- name: Read the swap signature
  ansible.builtin.command:
    argv:
      - swaplabel
      - "{{ swap_file_path }}"
  environment: &swap_tool_environment
    PATH: "{{ swap_tool_path }}"
  register: swap_file_signature
  changed_when: false
  failed_when: false

- name: Format the swap file when it carries no signature
  ansible.builtin.command:
    argv:
      - mkswap
      - "{{ swap_file_path }}"
  environment: *swap_tool_environment
  when: swap_file_signature.rc != 0
  register: swap_file_formatted
  changed_when: swap_file_formatted.rc == 0

# lineinfile rather than ansible.posix.mount keeps this playbook runnable with
# a bare ansible-core install, which is what CI and cloud-init provide.
- name: Record the swap file in fstab so it survives a reboot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap_file_path | regex_escape }}[[:space:]]"
    line: "{{ swap_file_path }} none swap sw,pri={{ swap_file_priority }} 0 0"
    owner: root
    group: root
    mode: "0644"
    validate: "findmnt --verify --tab-file %s"
  when: swap_manage_system | bool

- name: Read the active swap areas
  ansible.builtin.command:
    argv:
      - swapon
      - --noheadings
      - --show=NAME
  environment: *swap_tool_environment
  register: swap_active
  changed_when: false
  failed_when: false
  when: swap_manage_system | bool

- name: Activate the swap file
  ansible.builtin.command:
    argv:
      - swapon
      - "{{ swap_file_path }}"
  environment: *swap_tool_environment
  when:
    - swap_manage_system | bool
    - swap_file_path not in (swap_active.stdout_lines | default([]))
  changed_when: true

- name: Apply the memory tuning that keeps swap a margin rather than a crutch
  ansible.builtin.template:
    src: "{{ swap_sysctl_template }}"
    dest: "{{ swap_sysctl_path }}"
    owner: "{{ swap_file_owner }}"
    group: "{{ swap_file_group }}"
    mode: "0644"
  register: swap_sysctl

- name: Load the memory tuning
  ansible.builtin.command:
    argv:
      - sysctl
      - "--load={{ swap_sysctl_path }}"
  when:
    - swap_manage_system | bool
    - swap_sysctl.changed
  changed_when: true
