---
name: Validate Bibi's world

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validators
        run: python3 -m pip install ansible-core ansible-lint yamllint

      - name: Validate YAML
        run: >-
          yamllint
          -d '{extends: default, rules: {line-length: {max: 160}, document-start: disable, comments: disable}}'
          cloud-init.yaml group_vars/all.yml site.yml tasks/install-doctl.yml tests/fixtures/doctl-install.yml

      - name: Lint the Ansible playbooks
        run: ansible-lint site.yml tests/fixtures/doctl-install.yml

      - name: Check Ansible syntax
        run: |
          ansible-playbook --syntax-check -i 'localhost,' site.yml
          ansible-playbook --syntax-check -i 'localhost,' tests/fixtures/doctl-install.yml

      - name: Check shell syntax
        run: bash -n scripts/render-cloud-init.sh scripts/test-provisioning.sh scripts/verify.sh

      - name: Lint shell scripts and shell templates
        run: |
          shellcheck scripts/render-cloud-init.sh scripts/test-provisioning.sh scripts/verify.sh
          shellcheck templates/bibi-launcher.j2 templates/bibi-machine-update.j2 templates/bibi-motd.j2 templates/bibi-pi-extensions-update.j2

      - name: Exercise provisioning and verification fixtures
        run: scripts/test-provisioning.sh
