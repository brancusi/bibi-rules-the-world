---
name: Validate Bibi's world

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validators
        run: python3 -m pip install ansible-core ansible-lint yamllint

      # Every step below runs a `make lint` target, so the local gate and CI
      # cannot drift apart. Run `make lint` to reproduce all of them at once.
      - name: Validate YAML
        run: make yaml

      - name: Lint and syntax-check the Ansible playbooks
        run: make ansible

      - name: Check shell syntax and lint shell scripts and templates
        run: make shell

      - name: Compile and unit-test the memory guard
        run: make python

      - name: Exercise provisioning and verification fixtures
        run: make test
